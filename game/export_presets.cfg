; Two builds of the game (ADR-0091): scripts/build.sh exports both from Linux with Godot's official templates.
; Content, card code and the C++ harness are plain files the game reads, so include_filter adds them to the .pck;
; the tests, tools, the test runner and the development sandbox runtime stay out (the runtime ships beside the game).

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.jsonc, *.json, *.py, *.js, *.cpp, *.hpp, *.h, *.txt"
exclude_filter="test/*, tools/*, addons/gdUnit4/*, sandbox/runtime/*, characters/_local/*, reports/*"
export_path="../build/stage/linux/Rootward.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.jsonc, *.json, *.py, *.js, *.cpp, *.hpp, *.h, *.txt"
exclude_filter="test/*, tools/*, addons/gdUnit4/*, sandbox/runtime/*, characters/_local/*, reports/*"
export_path="../build/stage/windows/Rootward.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/brand/icon-256.png"
application/console_wrapper_icon="res://assets/brand/icon-256.png"
application/icon_interpolation=4
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name=""
application/product_name="Rootward"
application/file_description="Rootward"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
